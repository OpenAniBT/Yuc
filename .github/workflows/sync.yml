name: Sync Yuc archive

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 2 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every discovered page without conditional requests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yuc-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Synchronize public pages
        id: sync
        env:
          FULL_SYNC: ${{ inputs.full || github.event.schedule == '43 2 * * 0' }}
        run: |
          sync_exit=0
          if [ "$FULL_SYNC" = "true" ]; then
            python -m yuc sync --full || sync_exit=$?
          else
            python -m yuc sync || sync_exit=$?
          fi
          case "$sync_exit" in
            0|2) echo "publishable=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$sync_exit" ;;
          esac
      - name: Validate synchronized archive
        if: success() && steps.sync.outputs.publishable == 'true'
        run: python -m yuc validate
      - name: Commit changed archive
        if: success() && steps.sync.outputs.publishable == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/
          if git diff --cached --quiet -- data/; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sync Yuc archive"
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Require fresh healthy synchronization
        if: success() && steps.sync.outputs.publishable == 'true'
        run: python -m yuc health
      - name: Write run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/summary.md ]; then
            printf '%s\n' '# Yuc 同步报告' '' '同步未生成报告。请查看安装依赖、测试和同步步骤的日志。' > reports/summary.md
          fi
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n工作流状态：%s。提交和推送结果以对应步骤日志为准。\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yuc-sync-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
