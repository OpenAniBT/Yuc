name: Sync Yuc archive

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 2 * * 0"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every discovered page without conditional requests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yuc-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Synchronize public pages
        env:
          FULL_SYNC: ${{ inputs.full || github.event.schedule == '43 2 * * 0' }}
        run: |
          if [ "$FULL_SYNC" = "true" ]; then
            python -m yuc sync --full
          else
            python -m yuc sync
          fi
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate synchronized archive
        run: python -m yuc validate
      - name: Commit changed archive
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/
          if git diff --cached --quiet -- data/; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): sync Yuc archive"
          git push origin "HEAD:$DEFAULT_BRANCH"
